[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-favicon-generator"
version = "0.1.0"
description = "Generate a modern favicon set from a single source image."
readme = "README-PYPI.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["favicon", "icons", "pwa", "pillow", "cli"]

dependencies = [
  "Pillow>=12.0,<13.0",
  "cairosvg",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lupaxa-code-playground/favicon-generator"
Repository = "https://github.com/lupaxa-code-playground/favicon-generator"
Issues = "https://github.com/lupaxa-code-playground/favicon-generator/issues"

[project.scripts]
favicon-generator = "lupaxa.favicon_generator.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "bump-my-version>=1.2.0",
  "pip-audit>=2.7.0",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.version]
path = "src/lupaxa/favicon_generator/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "README.md",
  "README-PYPI.md",
  "LICENSE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<version>.*)"
serialize = ["{version}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
allow_dirty = false
commit = true
message = "Release {new_version}"
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
# Note: bump-my-version is provisional and may be replaced later.
# Omit post_commit_hooks that auto-push (user pushes manually).

[[tool.bumpversion.files]]
filename = "src/lupaxa/favicon_generator/version.py"
search = '^__version__ = "{current_version}"$'
replace = '__version__ = "{new_version}"'
use_regex = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '^version = "{current_version}"$'
replace = 'version = "{new_version}"'
use_regex = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '^current_version = "{current_version}"$'
replace = 'current_version = "{new_version}"'
use_regex = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "C4", "ISC", "D", "ANN", "PT"]
ignore = [
  "D200", "D201", "D202", "D203", "D204", "D205", "D206", "D207", "D208", "D209", "D210", "D211", "D212",
]

[tool.ruff.lint.per-file-ignores]
# Existing modules and tests can tighten documentation incrementally.
"src/lupaxa/favicon_generator/*.py" = ["D", "ANN"]
"tests/*" = ["S101", "S105", "D", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings --cov=lupaxa.favicon_generator --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "cairo: tests that require a working native Cairo library",
]

[tool.coverage.run]
source = ["lupaxa.favicon_generator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
