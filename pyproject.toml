[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-favicon-generator"
version = "0.1.0"
description = "Generate a modern favicon set from a single source image."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=12.0,<13.0",
  "cairosvg",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
favicon-generator = "lupaxa.favicon_generator.cli:main"

[tool.hatch.version]
path = "src/lupaxa/favicon_generator/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
